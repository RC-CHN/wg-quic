{% if helpers.exists('OPNsense.wireguardquic.general.enabled') and OPNsense.wireguardquic.general.enabled == '1' %}
{% if helpers.exists('OPNsense.wireguardquic.server.servers.server') %}
{%   for server in helpers.toList('OPNsense.wireguardquic.server.servers.server') %}
{%     if TARGET_FILTERS['OPNsense.wireguardquic.server.servers.server.' ~ loop.index0] or TARGET_FILTERS['OPNsense.wireguardquic.server.servers.server'] %}
{%       if server.enabled == '1' %}
[Interface]
PrivateKey = {{ server.privkey }}
{%         if server.tunneladdress|default('') != '' %}
Address = {{ server.tunneladdress }}
{%         endif %}
{%         if server.port|default('') != '' %}
ListenPort = {{ server.port }}
{%         endif %}
{%         if server.mtu|default('') != '' %}
MTU = {{ server.mtu }}
{%         endif %}
{%         if server.dns|default('') != '' %}
DNS = {{ server.dns }}
{%         endif %}
{%         if server.disableroutes == '1' %}
Table = off
{%         endif %}
# wg-quic: congestion = {{ server.congestion|default('auto') }}
# wg-quic: fec = {{ server.fec|default('auto') }}
# wg-quic: obfs = {{ server.obfs|default('salamander') }}
{%         if server.peers|default('') != '' %}
{%           for peer_uuid in server.peers.split(',') %}
{%             set peer = helpers.getUUID(peer_uuid) %}
{%             if peer != {} and peer.enabled == '1' %}

[Peer]
# Name = {{ peer.name }}
PublicKey = {{ peer.pubkey }}
{%               if peer.fec_policy|default('') != '' %}
# wg-quic: peer.fec-latency = {{ peer.fec_policy }}
{%               endif %}
{%               if peer.psk|default('') != '' %}
PresharedKey = {{ peer.psk }}
{%               endif %}
{%               if peer.serveraddress|default('') != '' %}
Endpoint = {% if ':' in peer.serveraddress %}[{{ peer.serveraddress }}]{% else %}{{ peer.serveraddress }}{% endif %}{% if peer.serverport|default('') != '' %}:{{ peer.serverport }}{% else %}:51820{% endif %}
{%               endif %}

AllowedIPs = {{ peer.tunneladdress }}
{%               if peer.keepalive|default('') != '' %}
PersistentKeepalive = {{ peer.keepalive }}
{%               endif %}
{%             endif %}
{%           endfor %}
{%         endif %}
{%       endif %}
{%     endif %}
{%   endfor %}
{% endif %}
{% endif %}
