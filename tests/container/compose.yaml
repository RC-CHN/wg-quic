services:
  a:
    image: wg-quic-e2e:local
    privileged: true
    volumes:
      - ./a.conf:/run/wg-quic-test/wg0.conf:ro
      - ./a-with-c.conf:/run/wg-quic-test/a-with-c.conf:ro
      - ./a-update-c.conf:/run/wg-quic-test/a-update-c.conf:ro
    networks:
      outer:
        ipv4_address: 172.29.0.2
        ipv6_address: fd00:29::2

  b:
    image: wg-quic-e2e:local
    privileged: true
    volumes:
      - ./b.conf:/run/wg-quic-test/wg0.conf:ro
    networks:
      outer:
        ipv4_address: 172.29.0.3
        ipv6_address: fd00:29::3

  a6:
    image: wg-quic-e2e:local
    privileged: true
    volumes:
      - ./a6.conf:/run/wg-quic-test/wg0.conf:ro
    networks:
      outer:
        ipv4_address: 172.29.0.4
        ipv6_address: fd00:29::4

  b6:
    image: wg-quic-e2e:local
    privileged: true
    volumes:
      - ./b6.conf:/run/wg-quic-test/wg0.conf:ro
    networks:
      outer:
        ipv4_address: 172.29.0.5
        ipv6_address: fd00:29::5

  c:
    image: wg-quic-e2e:local
    privileged: true
    volumes:
      - ./c.conf:/run/wg-quic-test/wg0.conf:ro
    networks:
      outer:
        ipv4_address: 172.29.0.6
        ipv6_address: fd00:29::6

  lifetime:
    image: wg-quic-e2e:local
    privileged: true
    environment:
      WG_QUIC_TEST_PARENT_DEATH: "1"
    volumes:
      - ./lifetime.conf:/run/wg-quic-test/wg0.conf:ro
    networks:
      outer:
        ipv4_address: 172.29.0.7
        ipv6_address: fd00:29::7

networks:
  outer:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
        - subnet: fd00:29::/64
