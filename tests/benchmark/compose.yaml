services:
  a:
    image: wg-quic-bench:local
    privileged: true
    volumes:
      - ${WGQ_BENCH_CONFIG_DIR}/a.conf:/run/wg-quic-benchmark/wg0.conf:ro
      - ${WGQ_BENCH_CONFIG_DIR}/a.uapi:/run/wg-quic-benchmark/wg0.uapi:ro
    environment:
      WGQ_BENCH_TRANSPORT: ${WGQ_BENCH_TRANSPORT:-wg-quic}
      WGQ_BENCH_ADDRESS: 10.88.0.1/32
      WGQ_BENCH_PEER_ADDRESS: 10.88.0.2/32
      WGQ_BENCH_MTU: ${WGQ_BENCH_MTU:-1280}
      WGQ_BENCH_DISABLE_OFFLOADS: ${WGQ_BENCH_DISABLE_OFFLOADS:-0}
    networks:
      outer:
        ipv4_address: 172.30.0.2

  b:
    image: wg-quic-bench:local
    privileged: true
    volumes:
      - ${WGQ_BENCH_CONFIG_DIR}/b.conf:/run/wg-quic-benchmark/wg0.conf:ro
      - ${WGQ_BENCH_CONFIG_DIR}/b.uapi:/run/wg-quic-benchmark/wg0.uapi:ro
    environment:
      WGQ_BENCH_TRANSPORT: ${WGQ_BENCH_TRANSPORT:-wg-quic}
      WGQ_BENCH_ADDRESS: 10.88.0.2/32
      WGQ_BENCH_PEER_ADDRESS: 10.88.0.1/32
      WGQ_BENCH_MTU: ${WGQ_BENCH_MTU:-1280}
      WGQ_BENCH_DISABLE_OFFLOADS: ${WGQ_BENCH_DISABLE_OFFLOADS:-0}
    networks:
      outer:
        ipv4_address: 172.30.0.3

networks:
  outer:
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.0.0/24
