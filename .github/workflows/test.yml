name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: ./scripts/check-no-reference-deps.sh
      - run: go test ./...
      - name: Pinned WireGuard behavior over production ArmorBind
        run: go test -count=1 -run '^TestWireGuard' ./internal/bind
      - run: go test -race ./...
      - run: shellcheck scripts/*.sh tests/container/*.sh packaging/freebsd/wg_quic
      - run: make build-windows
      - name: Upload self-contained Windows test bundles
        uses: actions/upload-artifact@v6
        with:
          name: wg-quic-windows
          path: |
            build/wg-quic-windows-amd64
            build/wg-quic-windows-arm64

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Project tests
        run: go test ./...
      - name: QUIC and ArmorBind loopback stress
        run: go test -count=10 -timeout=5m ./internal/transport/quic ./internal/bind
      - name: Named Pipe behavior
        run: go test -count=3 -timeout=5m ./third_party/wireguard-go/ipc/namedpipe
      - name: Windows control and quick lifecycle stress
        run: go test -count=10 -timeout=5m ./internal/control ./internal/platform ./internal/quick
      - name: Build and smoke Windows CLIs
        shell: pwsh
        run: |
          go build -o wg-quic.exe ./cmd/wg-quic
          go build -o wg-quic-quick.exe ./cmd/wg-quic-quick
          .\wg-quic.exe version
          .\wg-quic-quick.exe version
      - name: Cross-build Windows arm64 CLIs
        shell: pwsh
        run: |
          $env:GOARCH = "arm64"
          go build -o wg-quic-arm64.exe ./cmd/wg-quic
          go build -o wg-quic-quick-arm64.exe ./cmd/wg-quic-quick

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Native FreeBSD tests
        uses: vmactions/freebsd-vm@v1.5.2
        with:
          release: "14.4"
          usesh: true
          copyback: false
          prepare: pkg install -y go
          run: |
            go version
            ./scripts/check-no-reference-deps.sh
            go test ./...
            go test -count=1 -run '^TestWireGuard' ./internal/bind
            go test -count=5 -timeout=5m ./internal/transport/quic ./internal/bind
            go test -race ./internal/...
            go build ./cmd/wg-quic
            go build ./cmd/wg-quic-quick
            env GOARCH=arm64 go build -o /tmp/wg-quic-arm64 ./cmd/wg-quic
            env GOARCH=arm64 go build -o /tmp/wg-quic-quick-arm64 ./cmd/wg-quic-quick
            sh -n packaging/freebsd/wg_quic

  container:
    name: Two-node Linux tunnel interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sudo modprobe tun
      - run: ./tests/container/test.sh
