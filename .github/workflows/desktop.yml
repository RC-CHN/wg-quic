name: desktop

on:
  workflow_call:
    inputs:
      release:
        description: Collect versioned installers for the GitHub release
        required: false
        default: false
        type: boolean
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/desktop.yml"
      - "VERSION"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "tests/windows/**"
      - "third_party/**"
      - "desktop/**"
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "VERSION"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "tests/windows/**"
      - "third_party/**"
      - "desktop/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: linux
          - runner: windows-latest
            artifact: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Verify WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction Stop
          $light = Get-Command light.exe -ErrorAction Stop
          $wixVersion = (
            Get-Item -LiteralPath $candle.Source
          ).VersionInfo.ProductVersion
          if ($wixVersion -notmatch '^3\.14\.') {
            throw "expected WiX 3.14, found $wixVersion at $($candle.Source)"
          }
          Write-Host "WiX $wixVersion"
          Write-Host "candle=$($candle.Source)"
          Write-Host "light=$($light.Source)"
      - name: Audit desktop dependencies
        working-directory: desktop
        run: npm audit
      - name: Check TypeScript
        working-directory: desktop
        run: npm run check
      - name: Test desktop state and platform behavior
        working-directory: desktop
        run: npm test
      - name: Create desktop distributable
        working-directory: desktop
        run: npm run make
      - name: Smoke bundled wg-quic commands
        working-directory: desktop
        run: npm run smoke:native
      - name: Privileged Wintun and Windows service lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows/privileged-lifecycle.ps1 -BinDirectory ./desktop/resources/bin
      - name: Smoke packaged desktop app
        if: runner.os != 'Linux'
        working-directory: desktop
        run: npm run smoke:app
      - name: Install and exercise Windows desktop lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            ./desktop/out/make/wix/x64/*.msi |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "missing WiX MSI"
          }
          ./tests/windows/desktop-installed-lifecycle.ps1 `
            -Installer $installer.FullName
      - name: Install Linux desktop package
        if: runner.os == 'Linux'
        working-directory: desktop
        run: sudo apt-get install --no-install-recommends --yes ./out/make/deb/x64/*.deb
      - name: Smoke packaged desktop app
        if: runner.os == 'Linux'
        working-directory: desktop
        env:
          WG_QUIC_DESKTOP_EXECUTABLE: /usr/bin/wg-quic-desktop
        run: xvfb-run --auto-servernum npm run smoke:app
      - name: Collect versioned release installers
        if: inputs.release
        working-directory: desktop
        run: node scripts/collect-release.mjs ${{ matrix.artifact }}
      - name: Upload desktop distributable
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@v7
        with:
          name: wg-quic-desktop-${{ matrix.artifact }}
          path: desktop/out/make/**
          if-no-files-found: error
          retention-days: 14
      - name: Upload desktop release installers
        if: inputs.release
        uses: actions/upload-artifact@v7
        with:
          name: release-desktop-${{ matrix.artifact }}
          path: dist/release-desktop/*
          if-no-files-found: error
          retention-days: 14
